[package]
name = "kvitter"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/benjick/kvitter"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rand = "0.10.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
